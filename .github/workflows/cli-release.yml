# Builds the done-when command-line binary for Linux, macOS and Windows when a `cli-v*` tag is
# pushed, and attaches the archives to that tag's GitHub release.
name: cli-release

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo test --locked
        if: matrix.target == 'x86_64-unknown-linux-gnu'
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and smoke-test the archive
        env:
          TARGET: ${{ matrix.target }}
          FORMAT: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#cli-}"
          name="done-when-$version-$TARGET"
          binary=done-when
          if [[ "$FORMAT" == zip ]]; then binary="$binary.exe"; fi

          mkdir "$name"
          cp "target/$TARGET/release/$binary" "$name/"
          mkdir verify
          if [[ "$FORMAT" == zip ]]; then
            7z a "$name.zip" "$name/"
            7z x "$name.zip" -overify
          else
            tar czf "$name.tar.gz" "$name/"
            tar xzf "$name.tar.gz" -C verify
          fi
          test "$(verify/"$name"/"$binary" --version)" = "done-when ${version#v}"
          verify/"$name"/"$binary" --help >/dev/null
          echo "ARCHIVE=cli/$name.$FORMAT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate release checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "done-when command line"
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Model preview for {{name}}">
  <rect width="1200" height="630" fill="#f6f2ea"/>
  <text x="80" y="120" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="40" fill="#5b554b">Done When? · Model</text>
  <text x="80" y="255" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="64" font-weight="700" fill="#1f1c17">{{name}}</text>
  <text x="80" y="375" font-family="system-ui, sans-serif" font-size="44" fill="#0d6b64">{{quantityCount}} quantities</text>
  <text x="80" y="460" font-family="system-ui, sans-serif" font-size="36" fill="#5b554b">Open the model to see its latest results</text>
  <rect x="80" y="520" width="1040" height="6" fill="#b8410f"/>
</svg>

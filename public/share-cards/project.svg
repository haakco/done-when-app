<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="{{name}}: estimate {{estimateLow}} to {{estimateHigh}}">
  <rect width="1200" height="630" fill="#f6f2ea"/>
  <text x="80" y="120" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="40" fill="#5b554b">Done When? · Project</text>
  <text x="80" y="210" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="64" font-weight="700" fill="#1f1c17">{{name}}</text>
  <text x="80" y="300" font-family="system-ui, sans-serif" font-size="36" fill="#5b554b">Promised for {{deliveryTarget}}</text>
  <text x="80" y="400" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="72" fill="#0d6b64">{{estimateLow}} – {{estimateHigh}}</text>
  <text x="80" y="470" font-family="system-ui, sans-serif" font-size="32" fill="#5b554b">Latest 90% estimate</text>
  <text x="80" y="550" font-family="system-ui, sans-serif" font-size="40" font-weight="600" fill="#b8410f">{{chance}}% chance by the target</text>
</svg>
